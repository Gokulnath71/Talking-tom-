<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Talking Tom - Talk to the Cat</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app">
    <h1 id="title">Talking Tom</h1>
    <p class="subtitle">Type something and Tom will repeat it in a funny cartoon voice!</p>

    <div class="character-bar" id="characterBar" role="group" aria-label="Choose a character">
      <button type="button" class="character active" data-character="tom">Tom</button>
      <button type="button" class="character" data-character="snowball">Snowball</button>
      <button type="button" class="character" data-character="midnight">Midnight</button>
      <button type="button" class="character" data-character="ginger">Ginger</button>
      <button type="button" class="character" data-character="blueberry">Blueberry</button>
    </div>

    <div id="unsupported" class="unsupported" hidden>
      Sorry, your browser does not support speech. Try the latest Chrome or Edge.
    </div>

    <section class="stage">
      <div id="cat" class="cat" role="img" aria-label="An animated cartoon cat named Tom">
        <svg viewBox="0 0 320 320" xmlns="http://www.w3.org/2000/svg">
          <!-- tail -->
          <g class="tail">
            <path d="M60 240 C20 240 20 180 55 175" fill="none" stroke="#c9781f" stroke-width="18" stroke-linecap="round" />
          </g>

          <!-- body -->
          <ellipse class="body fur" cx="170" cy="248" rx="86" ry="60" fill="#f0a63a" />
          <ellipse class="fur-light" cx="170" cy="258" rx="56" ry="42" fill="#ffd79a" />

          <!-- paws -->
          <ellipse class="fur-light" cx="128" cy="296" rx="22" ry="14" fill="#ffd79a" />
          <ellipse class="fur-light" cx="212" cy="296" rx="22" ry="14" fill="#ffd79a" />

          <!-- head -->
          <g class="head">
            <!-- ears -->
            <path class="fur" d="M104 96 L92 40 L150 74 Z" fill="#f0a63a" />
            <path class="fur" d="M236 96 L248 40 L190 74 Z" fill="#f0a63a" />
            <path class="inner-ear" d="M112 90 L106 58 L140 78 Z" fill="#ff9db3" />
            <path class="inner-ear" d="M228 90 L234 58 L200 78 Z" fill="#ff9db3" />

            <!-- face -->
            <ellipse class="face fur-face" cx="170" cy="140" rx="82" ry="72" fill="#f5b354" />
            <ellipse class="muzzle" cx="170" cy="166" rx="52" ry="40" fill="#ffe3b8" />

            <!-- cheeks (light up while talking) -->
            <ellipse class="cheek cheek-left" cx="116" cy="164" rx="17" ry="11" fill="#ff9db3" />
            <ellipse class="cheek cheek-right" cx="224" cy="164" rx="17" ry="11" fill="#ff9db3" />

            <!-- eyes -->
            <g class="eye eye-left">
              <ellipse cx="140" cy="128" rx="16" ry="18" fill="#fff" />
              <circle class="pupil" cx="140" cy="130" r="8" fill="#2b2b2b" />
              <circle cx="137" cy="127" r="3" fill="#fff" />
              <g class="swirl">
                <circle cx="140" cy="130" r="14" fill="#e2647a" />
                <circle cx="140" cy="130" r="10" fill="#fff" />
                <circle cx="140" cy="130" r="6" fill="#e2647a" />
                <circle cx="140" cy="130" r="2.5" fill="#fff" />
                <circle class="swirl-ring" cx="140" cy="130" r="15" fill="none"
                        stroke="#7a2b38" stroke-width="3" stroke-dasharray="6 5" />
              </g>
              <g class="xeye">
                <path d="M131 121 L149 139 M149 121 L131 139" fill="none"
                      stroke="#2b2b2b" stroke-width="4" stroke-linecap="round" />
              </g>
            </g>
            <g class="eye eye-right">
              <ellipse cx="200" cy="128" rx="16" ry="18" fill="#fff" />
              <circle class="pupil" cx="200" cy="130" r="8" fill="#2b2b2b" />
              <circle cx="197" cy="127" r="3" fill="#fff" />
              <g class="swirl">
                <circle cx="200" cy="130" r="14" fill="#e2647a" />
                <circle cx="200" cy="130" r="10" fill="#fff" />
                <circle cx="200" cy="130" r="6" fill="#e2647a" />
                <circle cx="200" cy="130" r="2.5" fill="#fff" />
                <circle class="swirl-ring" cx="200" cy="130" r="15" fill="none"
                        stroke="#7a2b38" stroke-width="3" stroke-dasharray="6 5" />
              </g>
              <g class="xeye">
                <path d="M191 121 L209 139 M209 121 L191 139" fill="none"
                      stroke="#2b2b2b" stroke-width="4" stroke-linecap="round" />
              </g>
            </g>

            <!-- eyebrows (raise while talking) -->
            <path class="brow brow-left" d="M122 106 Q140 98 158 106"
                  fill="none" stroke="#a9682a" stroke-width="5" stroke-linecap="round" />
            <path class="brow brow-right" d="M182 106 Q200 98 218 106"
                  fill="none" stroke="#a9682a" stroke-width="5" stroke-linecap="round" />

            <!-- nose + mouth -->
            <path class="nose" d="M162 156 L178 156 L170 166 Z" fill="#e2647a" />
            <g class="mouth">
              <ellipse class="mouth-open" cx="170" cy="184" rx="19" ry="15" fill="#7a2b38" />
              <ellipse class="tongue" cx="170" cy="191" rx="10" ry="7" fill="#ff8a9a" />
              <path class="mouth-line" d="M170 166 L170 174 M170 174 C160 184 150 174 148 172 M170 174 C180 184 190 174 192 172"
                    fill="none" stroke="#8a4a2b" stroke-width="4" stroke-linecap="round" />
            </g>
          </g>

          <!-- action effects: food -->
          <g class="food" aria-hidden="true">
            <ellipse cx="170" cy="303" rx="34" ry="12" fill="#8d6748" />
            <ellipse cx="170" cy="299" rx="34" ry="10" fill="#b98a63" />
            <ellipse cx="162" cy="295" rx="12" ry="7" fill="#9ecbe0" />
            <path d="M174 295 l12 -7 v14 Z" fill="#7fb4cc" />
            <circle cx="157" cy="294" r="1.8" fill="#2b2b2b" />
          </g>

          <!-- action effects: love hearts -->
          <g class="hearts" aria-hidden="true">
            <g transform="translate(120 74)"><path class="heart h1" d="M0 6 C-3 -1 -12 0 -12 7 C-12 14 -4 18 0 24 C4 18 12 14 12 7 C12 0 3 -1 0 6 Z" fill="#ff5c8a" /></g>
            <g transform="translate(170 58)"><path class="heart h2" d="M0 6 C-3 -1 -12 0 -12 7 C-12 14 -4 18 0 24 C4 18 12 14 12 7 C12 0 3 -1 0 6 Z" fill="#ff7aa2" /></g>
            <g transform="translate(220 78)"><path class="heart h3" d="M0 6 C-3 -1 -12 0 -12 7 C-12 14 -4 18 0 24 C4 18 12 14 12 7 C12 0 3 -1 0 6 Z" fill="#ff5c8a" /></g>
          </g>

          <!-- action effects: dizzy stars -->
          <g class="stars" aria-hidden="true">
            <g transform="translate(170 40)"><path class="star" d="M0 -7 L2 -2 L7 0 L2 2 L0 7 L-2 2 L-7 0 L-2 -2 Z" fill="#ffd23f" stroke="#e6a700" stroke-width="1" /></g>
            <g transform="translate(96 96)"><path class="star" d="M0 -7 L2 -2 L7 0 L2 2 L0 7 L-2 2 L-7 0 L-2 -2 Z" fill="#ffd23f" stroke="#e6a700" stroke-width="1" /></g>
            <g transform="translate(244 96)"><path class="star" d="M0 -7 L2 -2 L7 0 L2 2 L0 7 L-2 2 L-7 0 L-2 -2 Z" fill="#ffd23f" stroke="#e6a700" stroke-width="1" /></g>
          </g>
        </svg>
      </div>
    </section>

    <section class="controls">
      <label class="sr-only" for="speech">What should Tom say?</label>
      <textarea id="speech" rows="3" placeholder="Type something for Tom to say...">Hello! I am Talking Tom.</textarea>

      <div class="buttons">
        <button id="speakBtn" type="button" class="primary">Speak</button>
        <button id="stopBtn" type="button">Stop</button>
      </div>

      <div class="sliders">
        <label>
          Pitch <span id="pitchVal">2</span>
          <input id="pitch" type="range" min="0" max="2" step="0.1" value="2" />
        </label>
        <label>
          Speed <span id="rateVal">1.2</span>
          <input id="rate" type="range" min="0.5" max="2" step="0.1" value="1.2" />
        </label>
        <label class="live">
          <input id="live" type="checkbox" />
          Repeat while typing
        </label>
      </div>

      <div class="actions">
        <button id="feedBtn" type="button">Feed</button>
        <button id="chillBtn" type="button">Chill</button>
        <button id="hypnoBtn" type="button">Hypno-pet</button>
        <button id="tickleBtn" type="button">Tickle</button>
        <button id="slapBtn" type="button">Slap</button>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
